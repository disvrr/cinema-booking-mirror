# DEMO2: EC2 private addresses. Confirm application port with APP owner.
upstream app_backend {
    # Round Robin is the default algorithm.
    server {app1_privat_ip}:8080 max_fails=3 fail_timeout=10s; # APP1
    server {app2_privat_ip}:8080 max_fails=3 fail_timeout=10s; # APP2
}

server {
    listen 80 default_server;
    server_name _;

    proxy_connect_timeout 5s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;

    location / {
        proxy_pass http://app_backend;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_next_upstream error timeout http_500 http_502 http_503;
    }

}
